spring:
  application:
    name: msocial
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/msocial}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:your-secret-key-here-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

auth:
  dev:
    skip-verify: ${DEV_AUTH_SKIP_VERIFY:true}

app:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      avatar-path: ${AVATAR_STORAGE_PATH:./uploads/avatars}
      track-path: ${TRACK_STORAGE_PATH:./uploads/tracks}

matrix:
  federation:
    base-url: ${MATRIX_BASE_URL:https://matrix.org}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
